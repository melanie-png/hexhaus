<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexhaus — Floor Plan</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0510;
    font-family: 'Cinzel', 'Georgia', serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 2rem;
  }
  .container {
    width: 900px; max-width: 100%;
  }
  h1 {
    text-align: center; color: #c9a84c;
    font-size: 1.6rem; letter-spacing: 0.3em;
    margin-bottom: 0.3rem; text-transform: uppercase;
  }
  .subtitle {
    text-align: center; color: #8a6898;
    font-size: 0.75rem; letter-spacing: 0.2em;
    margin-bottom: 2rem;
  }
  svg { display: block; margin: 0 auto; }
  .legend {
    display: flex; justify-content: center; gap: 2rem;
    margin-top: 1.5rem; flex-wrap: wrap;
  }
  .legend-item {
    display: flex; align-items: center; gap: 0.5rem;
    color: #8a6898; font-size: 0.7rem; letter-spacing: 0.1em;
  }
  .legend-swatch {
    width: 14px; height: 14px; border-radius: 2px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Hexhaus</h1>
  <p class="subtitle">House Layout &amp; Room Progression</p>

  <svg viewBox="0 0 880 620" width="880" height="620">
    <!-- Defs: gradients, filters -->
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1a0a28"/>
        <stop offset="100%" stop-color="#0f0518"/>
      </linearGradient>
      <linearGradient id="lowerGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0f0518"/>
        <stop offset="100%" stop-color="#080310"/>
      </linearGradient>
    </defs>

    <!-- Ground floor label -->
    <text x="440" y="22" text-anchor="middle" fill="#5a3868" font-size="11" letter-spacing="3">GROUND FLOOR</text>
    <!-- Ground floor background -->
    <rect x="40" y="30" width="800" height="280" rx="6" fill="url(#groundGrad)" stroke="#3a1850" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- ENTRANCE HALL (bottom center) -->
    <rect x="340" y="180" width="200" height="120" rx="4" fill="#2a1038" stroke="#c9a84c" stroke-width="2"/>
    <text x="440" y="225" text-anchor="middle" fill="#c9a84c" font-size="14" letter-spacing="2">ENTRANCE</text>
    <text x="440" y="245" text-anchor="middle" fill="#c9a84c" font-size="14" letter-spacing="2">HALL</text>
    <text x="440" y="270" text-anchor="middle" fill="#8a6898" font-size="9" letter-spacing="1">START</text>
    <!-- Front door arrow -->
    <polygon points="440,310 430,300 450,300" fill="#c9a84c" filter="url(#glow)"/>
    <text x="440" y="325" text-anchor="middle" fill="#c9a84c" font-size="9" letter-spacing="1">FRONT DOOR</text>

    <!-- LIVING ROOM (bottom left) -->
    <rect x="60" y="180" width="240" height="120" rx="4" fill="#2a1038" stroke="#7a5868" stroke-width="1.5"/>
    <text x="180" y="225" text-anchor="middle" fill="#c9b89a" font-size="13" letter-spacing="2">LIVING ROOM</text>
    <text x="180" y="248" text-anchor="middle" fill="#6a4878" font-size="8" letter-spacing="1">Moonlit window · Crystal ball</text>
    <text x="180" y="262" text-anchor="middle" fill="#6a4878" font-size="8" letter-spacing="1">Fireplace · Chandelier</text>
    <!-- Sample number badge -->
    <circle cx="85" cy="200" r="11" fill="#3a1850" stroke="#c9a84c" stroke-width="1"/>
    <text x="85" y="204" text-anchor="middle" fill="#c9a84c" font-size="9">5</text>

    <!-- LIBRARY (top left) -->
    <rect x="60" y="50" width="240" height="120" rx="4" fill="#2a1038" stroke="#7a5868" stroke-width="1.5"/>
    <text x="180" y="95" text-anchor="middle" fill="#c9b89a" font-size="13" letter-spacing="2">LIBRARY</text>
    <text x="180" y="118" text-anchor="middle" fill="#6a4878" font-size="8" letter-spacing="1">Staircase · Display cases</text>
    <text x="180" y="132" text-anchor="middle" fill="#6a4878" font-size="8" letter-spacing="1">Owl · Floating magic wisps</text>
    <circle cx="85" cy="70" r="11" fill="#3a1850" stroke="#c9a84c" stroke-width="1"/>
    <text x="85" y="74" text-anchor="middle" fill="#c9a84c" font-size="9">1</text>

    <!-- KITCHEN (top center) -->
    <rect x="340" y="50" width="200" height="120" rx="4" fill="#2a1038" stroke="#7a5868" stroke-width="1.5"/>
    <text x="440" y="95" text-anchor="middle" fill="#c9b89a" font-size="13" letter-spacing="2">KITCHEN</text>
    <text x="440" y="118" text-anchor="middle" fill="#6a4878" font-size="8" letter-spacing="1">Hearth cauldron · Pot rack</text>
    <text x="440" y="132" text-anchor="middle" fill="#6a4878" font-size="8" letter-spacing="1">Knife block · Red rug</text>
    <circle cx="365" cy="70" r="11" fill="#3a1850" stroke="#c9a84c" stroke-width="1"/>
    <text x="365" y="74" text-anchor="middle" fill="#c9a84c" font-size="9">2·3</text>

    <!-- CORRIDOR / CONNECTION lines ground floor -->
    <!-- Hall to Living Room -->
    <line x1="340" y1="240" x2="300" y2="240" stroke="#5a3868" stroke-width="2"/>
    <text x="320" y="232" text-anchor="middle" fill="#5a3868" font-size="7">door</text>

    <!-- Hall to Kitchen (up) -->
    <line x1="440" y1="180" x2="440" y2="170" stroke="#5a3868" stroke-width="2"/>
    <line x1="440" y1="170" x2="440" y2="170" stroke="#5a3868" stroke-width="2"/>

    <!-- Hall to Library (diagonal) -->
    <line x1="340" y1="200" x2="300" y2="170" stroke="#5a3868" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="335" y="195" text-anchor="middle" fill="#5a3868" font-size="7">arch</text>

    <!-- Kitchen to Hall connection (through corridor) -->
    <line x1="440" y1="170" x2="440" y2="180" stroke="#5a3868" stroke-width="2"/>
    <text x="455" y="178" fill="#5a3868" font-size="7">door</text>

    <!-- Lower floor label -->
    <text x="440" y="345" text-anchor="middle" fill="#5a3868" font-size="11" letter-spacing="3">LOWER FLOOR</text>
    <!-- Lower floor background -->
    <rect x="40" y="355" width="800" height="250" rx="6" fill="url(#lowerGrad)" stroke="#3a1850" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- PANTRY (top center of lower floor) -->
    <rect x="340" y="370" width="200" height="100" rx="4" fill="#1a0a20" stroke="#7a5868" stroke-width="1.5"/>
    <text x="440" y="408" text-anchor="middle" fill="#c9b89a" font-size="13" letter-spacing="2">PANTRY</text>
    <text x="440" y="430" text-anchor="middle" fill="#6a4878" font-size="8" letter-spacing="1">Specimen jars · Root cellar</text>
    <text x="440" y="444" text-anchor="middle" fill="#6a4878" font-size="8" letter-spacing="1">Produce baskets · Burlap sacks</text>
    <circle cx="365" cy="390" r="11" fill="#3a1850" stroke="#c9a84c" stroke-width="1"/>
    <text x="365" y="394" text-anchor="middle" fill="#c9a84c" font-size="9">4</text>

    <!-- BASEMENT (bottom center of lower floor) -->
    <rect x="300" y="495" width="280" height="100" rx="4" fill="#1a0a20" stroke="#c94040" stroke-width="2"/>
    <text x="440" y="533" text-anchor="middle" fill="#c94040" font-size="14" letter-spacing="2">BASEMENT</text>
    <text x="440" y="555" text-anchor="middle" fill="#8a4848" font-size="8" letter-spacing="1">Alchemy still · Pentagram floor</text>
    <text x="440" y="569" text-anchor="middle" fill="#8a4848" font-size="8" letter-spacing="1">Specimen archway · HELGA HEX</text>
    <circle cx="325" cy="515" r="11" fill="#3a0a10" stroke="#c94040" stroke-width="1"/>
    <text x="325" y="519" text-anchor="middle" fill="#c94040" font-size="9">6</text>
    <!-- Boss icon -->
    <text x="540" y="520" text-anchor="middle" fill="#c94040" font-size="20" filter="url(#glow)">☠</text>

    <!-- Stairs: Kitchen → Pantry -->
    <line x1="440" y1="170" x2="440" y2="370" stroke="#5a3868" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="425" y="280" width="30" height="50" rx="3" fill="none" stroke="#5a3868" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="470" y="310" fill="#5a3868" font-size="8" letter-spacing="1">stairs ↓</text>

    <!-- Stairs: Pantry → Basement -->
    <line x1="440" y1="470" x2="440" y2="495" stroke="#5a3868" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="455" y="488" fill="#5a3868" font-size="8" letter-spacing="1">stairs ↓</text>

    <!-- Connection labels -->
    <!-- Hall→Living Room -->
    <!-- Hall→Library -->
    <!-- Hall→Kitchen -->
    <!-- Kitchen→Pantry -->
    <!-- Pantry→Basement -->

  </svg>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-swatch" style="background:#2a1038;border:1px solid #c9a84c"></div>
      <span>Start room</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#2a1038;border:1px solid #7a5868"></div>
      <span>Exploration rooms</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#1a0a20;border:1px solid #c94040"></div>
      <span>Final boss room</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:transparent;border:1px dashed #5a3868"></div>
      <span>Stairs / descent</span>
    </div>
  </div>
</div>
</body>
</html>
